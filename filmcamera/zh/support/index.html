<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Film Camera 支持与常见问题。">
  <link rel="alternate" hreflang="en" href="https://phpstone.github.io/filmcamera/support/">
  <link rel="alternate" hreflang="zh-CN" href="https://phpstone.github.io/filmcamera/zh/support/">
  <link rel="alternate" hreflang="x-default" href="https://phpstone.github.io/filmcamera/support/">
  <title>支持 — Film Camera</title>
  <style>
    :root { --paper: #f4efe4; --ink: #26241f; --muted: #716c62; --accent: #b94b32; --line: rgba(38, 36, 31, .14); }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .shell { width: min(760px, calc(100% - 40px)); margin: 0 auto; }
    header { display: flex; justify-content: space-between; gap: 24px; padding: 28px 0; border-bottom: 1px solid var(--line); }
    .brand { font: 700 1rem/1 Georgia, "Times New Roman", serif; letter-spacing: .14em; text-decoration: none; text-transform: uppercase; }
    nav { display: flex; gap: 18px; }
    nav a { color: var(--muted); font-size: .85rem; font-weight: 600; text-decoration: none; }
    nav a:hover { color: var(--accent); }
    main { padding: 76px 0 100px; }
    .eyebrow { margin: 0 0 18px; color: var(--accent); font-size: .78rem; font-weight: 700; letter-spacing: .14em; }
    h1 { margin: 0 0 20px; font-family: Georgia, "Songti SC", serif; font-size: clamp(2.8rem, 8vw, 5rem); font-weight: 400; letter-spacing: -.04em; line-height: 1; }
    .intro { margin: 0 0 52px; color: var(--muted); font-size: 1.05rem; line-height: 1.85; }
    section { padding: 30px 0; border-top: 1px solid var(--line); }
    h2 { margin: 0 0 12px; font-family: Georgia, "Songti SC", serif; font-size: 1.35rem; font-weight: 400; }
    p { margin: 0; color: var(--muted); font-size: 1rem; line-height: 1.85; }
    a { color: inherit; }
    .button { display: inline-block; margin-top: 26px; padding: 14px 20px; color: #fff; background: var(--accent); border-radius: 2px; font-size: .85rem; font-weight: 700; letter-spacing: .04em; text-decoration: none; }
    .button:hover { background: #963a27; }
    footer { padding: 26px 0 34px; color: var(--muted); border-top: 1px solid var(--line); font-size: .8rem; line-height: 1.5; }
    @media (max-width: 560px) { header { align-items: flex-start; } nav { flex-direction: column; gap: 10px; text-align: right; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="../">Film Camera</a>
      <nav aria-label="主导航"><a href="../">首页</a><a href="../privacy/">隐私</a><a href="../../support/" lang="en">English</a></nav>
    </header>
    <main>
      <p class="eyebrow">我们随时为你提供帮助</p>
      <h1>支持</h1>
      <p class="intro">你可以先查看下面的常见问题。如果仍需要帮助，请在反馈中提供设备型号、操作系统版本和问题的简要说明。</p>
      <section><h2>为什么无法拍照？</h2><p>请打开设备设置，确认已经允许 Film Camera 使用相机。</p></section>
      <section><h2>为什么照片无法保存？</h2><p>请确认 Film Camera 拥有向照片图库添加照片的权限，并检查设备是否有足够的可用存储空间。</p></section>
      <section>
        <h2>如何报告问题？</h2>
        <p>请在 GitHub 上创建 Issue。不要在公开的问题报告中附加私人照片或其他敏感信息。</p>
        <a class="button" href="https://github.com/phpstone/phpstone.github.io/issues/new">提交支持请求</a>
      </section>
    </main>
    <footer>&copy; 2026 Film Camera.</footer>
  </div>
</body>
</html>
