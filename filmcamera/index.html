<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Film Camera brings the warmth and character of film photography to every shot.">
  <title>Film Camera</title>
  <style>
    :root { color-scheme: light; --paper: #f4efe4; --ink: #26241f; --muted: #716c62; --accent: #b94b32; --line: rgba(38, 36, 31, .14); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: radial-gradient(circle at 15% 0%, rgba(185, 75, 50, .12), transparent 30rem), var(--paper); font-family: Georgia, "Times New Roman", serif; }
    a { color: inherit; }
    .shell { width: min(1080px, calc(100% - 40px)); margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 28px 0; border-bottom: 1px solid var(--line); }
    .brand { font-size: 1rem; font-weight: 700; letter-spacing: .14em; text-decoration: none; text-transform: uppercase; }
    nav { display: flex; gap: 24px; }
    nav a { color: var(--muted); font: 600 .85rem/1 Arial, sans-serif; text-decoration: none; }
    nav a:hover { color: var(--accent); }
    main { display: grid; grid-template-columns: 1.1fr .9fr; gap: clamp(40px, 8vw, 110px); align-items: center; min-height: calc(100vh - 155px); padding: 72px 0 96px; }
    .eyebrow { margin: 0 0 20px; color: var(--accent); font: 700 .75rem/1.2 Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
    h1 { max-width: 720px; margin: 0; font-size: clamp(3.4rem, 8vw, 7.5rem); font-weight: 400; letter-spacing: -.055em; line-height: .88; }
    .intro { max-width: 560px; margin: 30px 0 0; color: var(--muted); font-size: clamp(1.05rem, 2vw, 1.3rem); line-height: 1.65; }
    .camera { position: relative; aspect-ratio: 4 / 5; overflow: hidden; border-radius: 2px; background: linear-gradient(rgba(38, 36, 31, .12), rgba(38, 36, 31, .28)), linear-gradient(145deg, #c98d64 0%, #876f52 48%, #435552 100%); box-shadow: 0 28px 70px rgba(54, 43, 28, .2); }
    .camera::before { content: ""; position: absolute; inset: 18%; border: 1px solid rgba(255, 255, 255, .42); border-radius: 50%; box-shadow: 0 0 0 30px rgba(26, 29, 27, .32), 0 0 0 31px rgba(255, 255, 255, .22); }
    .camera::after { content: "FILM / 24"; position: absolute; right: 22px; bottom: 20px; color: rgba(255, 255, 255, .8); font: 700 .7rem/1 Arial, sans-serif; letter-spacing: .14em; }
    footer { display: flex; justify-content: space-between; gap: 20px; padding: 24px 0 32px; color: var(--muted); border-top: 1px solid var(--line); font: .8rem/1.5 Arial, sans-serif; }
    footer p { margin: 0; }
    @media (max-width: 720px) { header { align-items: flex-start; gap: 20px; } nav { gap: 14px; } main { grid-template-columns: 1fr; min-height: auto; padding-top: 56px; } .camera { width: min(100%, 460px); } footer { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="./">Film Camera</a>
      <nav aria-label="Main navigation"><a href="privacy/">Privacy</a><a href="support/">Support</a></nav>
    </header>
    <main>
      <section>
        <p class="eyebrow">Slow down. Frame the moment.</p>
        <h1>Every frame has a story.</h1>
        <p class="intro">Film Camera brings the warmth, grain, and deliberate rhythm of analog photography to the moments you want to remember.</p>
      </section>
      <div class="camera" role="img" aria-label="Abstract camera lens artwork"></div>
    </main>
    <footer><p>&copy; <span id="year"></span> Film Camera.</p><p>Made for thoughtful photography.</p></footer>
  </div>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
