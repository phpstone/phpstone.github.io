<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="phpstone — independent apps and thoughtful digital experiences.">
  <title>phpstone</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4efe4;
      --ink: #26241f;
      --muted: #716c62;
      --accent: #b94b32;
      --line: rgba(38, 36, 31, .14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(circle at 85% 10%, rgba(185, 75, 50, .12), transparent 28rem), var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }
    a { color: inherit; }
    .shell { width: min(1080px, calc(100% - 40px)); margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 28px 0; border-bottom: 1px solid var(--line); }
    .brand { font-weight: 700; letter-spacing: .14em; text-decoration: none; text-transform: uppercase; }
    .github { color: var(--muted); font: 600 .85rem/1 Arial, sans-serif; text-decoration: none; }
    .github:hover { color: var(--accent); }
    main { min-height: calc(100vh - 150px); padding: clamp(72px, 12vw, 150px) 0 100px; }
    .eyebrow { margin: 0 0 22px; color: var(--accent); font: 700 .75rem/1.2 Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
    h1 { max-width: 820px; margin: 0; font-size: clamp(3.2rem, 9vw, 7.8rem); font-weight: 400; letter-spacing: -.055em; line-height: .9; }
    .intro { max-width: 600px; margin: 34px 0 70px; color: var(--muted); font-size: clamp(1.05rem, 2vw, 1.3rem); line-height: 1.65; }
    .projects { border-top: 1px solid var(--line); }
    .project { display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: center; padding: 30px 0; text-decoration: none; border-bottom: 1px solid var(--line); }
    .project h2 { margin: 0 0 8px; font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 400; }
    .project p { margin: 0; color: var(--muted); font: 1rem/1.6 Arial, sans-serif; }
    .arrow { color: var(--accent); font: 2rem/1 Arial, sans-serif; transition: transform .2s ease; }
    .project:hover .arrow { transform: translateX(6px); }
    footer { display: flex; justify-content: space-between; gap: 20px; padding: 24px 0 32px; color: var(--muted); border-top: 1px solid var(--line); font: .8rem/1.5 Arial, sans-serif; }
    footer p { margin: 0; }
    @media (max-width: 560px) { footer { flex-direction: column; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="/">phpstone</a>
      <a class="github" href="https://github.com/phpstone">GitHub</a>
    </header>
    <main>
      <p class="eyebrow">Independent creator</p>
      <h1>Small apps, thoughtfully made.</h1>
      <p class="intro">A home for focused digital experiences built with care.</p>
      <div class="projects" aria-label="Projects">
        <a class="project" href="/filmcamera/">
          <span><h2>Film Camera</h2><p>A slower, more intentional way to capture a moment.</p></span>
          <span class="arrow" aria-hidden="true">&rarr;</span>
        </a>
      </div>
    </main>
    <footer>
      <p>&copy; <span id="year"></span> phpstone.</p>
      <p><a href="https://github.com/phpstone/phpstone.github.io/issues">Contact &amp; support</a></p>
    </footer>
  </div>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
